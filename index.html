  <!-- Tema antes da primeira pintura: sem isso a página nasce
       escura e pisca pra clara em quem prefere o tema claro.
       Roda inline de propósito — precisa ser síncrono e vir
       antes do CSS. Quem já clicou no botão manda; senão,
       vale a preferência do sistema. -->
  <script>
    (function () {
      var tema = 'dark'
      try {
        var salvo = localStorage.getItem('tema')
        if (salvo === 'light' || salvo === 'dark') {
          tema = salvo
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          tema = 'light'
        }
      } catch (e) {
        /* storage bloqueado: fica no escuro, que é o padrão */
      }
      document.documentElement.dataset.theme = tema
      if (tema === 'light') {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F2ECE1')
      }
    })()
  </script>
